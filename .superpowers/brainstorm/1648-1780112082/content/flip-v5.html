<style>
  .scene {
    perspective: 1500px;
    perspective-origin: left center;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 380px;
    background: #faf7f2;
    border-radius: 16px;
    overflow: hidden;
  }

  .flip-box {
    width: 300px;
    height: 220px;
    position: relative;
    transform-style: preserve-3d;
  }

  .page-under {
    position: absolute;
    inset: 0;
    background: white;
    border: 1px solid #ede6dd;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    z-index: 0;
  }
  .page-under .icon { font-size: 30px; }
  .page-under .label { font-size: 13px; color: #9c8b7e; font-weight: 600; }

  .page-over {
    position: absolute;
    inset: 0;
    background: white;
    border: 1px solid #ede6dd;
    border-radius: 16px;
    transform-origin: left center;
    transform-style: preserve-3d;
    z-index: 1;
    animation: pageFlip 3s cubic-bezier(0.42, 0.0, 0.58, 1.0) infinite;
    overflow: hidden;
  }

  .page-over .front-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .page-over .front-face .icon { font-size: 42px; }
  .page-over .front-face .title { font-size: 17px; font-weight: 700; color: #3d342b; }
  .page-over .front-face .desc { font-size: 12px; color: #9c8b7e; }

  .page-over .back-face {
    position: absolute;
    inset: 0;
    background: #faf7f2;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform: rotateY(180deg);
    border-radius: 16px;
  }
  .page-over .back-face span { font-size: 16px; color: #9c8b7e; font-weight: 600; }

  /* Bend gradient: sweeps across as page turns */
  .bend-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    border-radius: 16px;
    animation: bendGradient 3s cubic-bezier(0.42, 0.0, 0.58, 1.0) infinite;
  }

  @keyframes pageFlip {
    0%, 15%   { transform: rotateY(0deg); }
    42%, 55%  { transform: rotateY(-170deg); }
    82%, 100% { transform: rotateY(0deg); }
  }

  @keyframes bendGradient {
    0%, 18% {
      background: transparent;
    }
    28% {
      background: linear-gradient(to right,
        transparent 0%,
        rgba(0,0,0,0.02) 30%,
        rgba(0,0,0,0.08) 50%,
        rgba(0,0,0,0.15) 70%,
        rgba(0,0,0,0.06) 90%,
        transparent 100%
      );
    }
    42%, 52% {
      background: linear-gradient(to right,
        transparent 0%,
        rgba(0,0,0,0.1) 20%,
        rgba(0,0,0,0.2) 40%,
        rgba(0,0,0,0.25) 55%,
        rgba(0,0,0,0.15) 75%,
        rgba(0,0,0,0.03) 92%,
        transparent 100%
      );
    }
    60% {
      background: linear-gradient(to right,
        transparent 0%,
        rgba(0,0,0,0.02) 10%,
        rgba(0,0,0,0.06) 30%,
        transparent 50%
      );
    }
    82%, 100% { background: transparent; }
  }

  /* Shadow behind the flipping page */
  .flip-shadow {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    z-index: -1;
    animation: flipShadow 3s cubic-bezier(0.42, 0.0, 0.58, 1.0) infinite;
  }
  @keyframes flipShadow {
    0%, 15%  { box-shadow: none; }
    35%, 55% { box-shadow: -16px 8px 36px rgba(0,0,0,0.18), -4px 4px 12px rgba(0,0,0,0.08); }
    80%, 100% { box-shadow: none; }
  }

  .spine {
    position: absolute;
    left: -3px;
    top: 14px;
    bottom: 14px;
    width: 5px;
    background: linear-gradient(to right, #b8aa96, #d6cec4, transparent);
    border-radius: 3px;
    z-index: 100;
  }

  .hint { margin-top: 20px; text-align: center; }
</style>
