<style>
  .scene {
    perspective: 1800px;
    perspective-origin: left center;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 380px;
    background: #faf7f2;
    border-radius: 16px;
    overflow: hidden;
  }

  .book-area {
    position: relative;
    width: 300px;
    height: 220px;
  }

  .back-page {
    position: absolute;
    inset: 0;
    background: white;
    border-radius: 16px;
    border: 1px solid #ede6dd;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    z-index: 0;
  }
  .back-page .icon { font-size: 30px; }
  .back-page .label { font-size: 13px; color: #9c8b7e; font-weight: 600; }

  .front-group {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    perspective: inherit;
  }

  .seg {
    flex: 1;
    height: 100%;
    background: white;
    transform-origin: left center;
    animation: segFlip 3.2s cubic-bezier(0.42, 0.0, 0.58, 1.0) infinite;
    position: relative;
    margin-right: -1px;
    z-index: 0;
  }
  .seg:first-child { border-radius: 16px 0 0 16px; }
  .seg:last-child  { border-radius: 0 16px 16px 0; margin-right: 0; }

  /* Overlap trick: each seg has a pseudo-element covering the gap */
  .seg::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: white;
    z-index: 1;
  }

  .seg:nth-child(1)  { animation-delay: 0.00s; }
  .seg:nth-child(2)  { animation-delay: 0.03s; }
  .seg:nth-child(3)  { animation-delay: 0.06s; }
  .seg:nth-child(4)  { animation-delay: 0.08s; }
  .seg:nth-child(5)  { animation-delay: 0.09s; }
  .seg:nth-child(6)  { animation-delay: 0.10s; }
  .seg:nth-child(7)  { animation-delay: 0.10s; }
  .seg:nth-child(8)  { animation-delay: 0.09s; }
  .seg:nth-child(9)  { animation-delay: 0.08s; }
  .seg:nth-child(10) { animation-delay: 0.06s; }
  .seg:nth-child(11) { animation-delay: 0.03s; }
  .seg:nth-child(12) { animation-delay: 0.00s; }

  @keyframes segFlip {
    0%, 10%   { transform: rotateY(0deg); }
    42%, 52%  { transform: rotateY(-175deg); }
    80%, 100% { transform: rotateY(0deg); }
  }

  .bend-shadow {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    z-index: -1;
    animation: bendShadow 3.2s cubic-bezier(0.42, 0.0, 0.58, 1.0) infinite;
    animation-delay: 0.05s;
  }
  @keyframes bendShadow {
    0%, 12%  { box-shadow: none; }
    35%, 58% { box-shadow: -14px 8px 32px rgba(0,0,0,0.22), -4px 3px 10px rgba(0,0,0,0.1); }
    80%, 100% { box-shadow: none; }
  }

  .spine {
    position: absolute;
    left: -3px;
    top: 12px;
    bottom: 12px;
    width: 5px;
    background: linear-gradient(to right, #b8aa96 0%, #d6cec4 50%, transparent 100%);
    border-radius: 3px;
    z-index: 100;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    z-index: 10;
    pointer-events: none;
    animation: fadeOverlay 3.2s cubic-bezier(0.42, 0.0, 0.58, 1.0) infinite;
  }
  @keyframes fadeOverlay {
    0%, 22%  { opacity: 1; }
    36%, 58% { opacity: 0.08; }
    76%, 100% { opacity: 1; }
  }
  .overlay .icon { font-size: 42px; }
  .overlay .title { font-size: 17px; font-weight: 700; color: #3d342b; }
  .overlay .desc { font-size: 11px; color: #9c8b7e; }

  .hint { margin-top: 20px; text-align: center; }
</style>
