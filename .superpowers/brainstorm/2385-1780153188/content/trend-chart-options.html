<h2>趋势图方案</h2>
<p class="subtitle">本月收支趋势 — 三种视觉风格</p>

<div class="cards">

      <div style="font-size:11px;font-weight:600;color:#3d342b;margin-bottom:10px;">方案 A：渐变面积图</div>
      <div style="height:120px;position:relative;overflow:hidden;">

            <linearGradient id="gA2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e25c3b" stop-opacity="0.3"/><stop offset="100%" stop-color="#e25c3b" stop-opacity="0.02"/></linearGradient>
          </defs>
          <!-- Grid lines -->
          <line x1="40" y1="20" x2="390" y2="20" stroke="#f5f2ed" stroke-width="1"/>
          <line x1="40" y1="60" x2="390" y2="60" stroke="#f5f2ed" stroke-width="1"/>
          <line x1="40" y1="100" x2="390" y2="100" stroke="#f5f2ed" stroke-width="1"/>

          <path d="M40,90 L100,90 L160,85 L220,30 L280,30 L340,85 L390,85 L390,110 L40,110 Z" fill="url(#gA1)"/>

          <path d="M40,50 L100,55 L160,95 L220,70 L280,70 L340,60 L390,45 L390,55 L40,55 Z" fill="url(#gA2)" opacity="0.6"/>
          <path d="M40,50 L100,55 L160,95 L220,70 L280,70 L340,60 L390,45" stroke="#e25c3b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

          <circle cx="220" cy="30" r="4" fill="#2ea87a" stroke="#fff" stroke-width="2"/>
          <circle cx="280" cy="30" r="3" fill="#2ea87a" stroke="#fff" stroke-width="1.5"/>
        </svg>
      </div>
      <div style="display:flex;gap:12px;font-size:9px;color:#9c8b7e;margin-top:4px;">
        <span>🟢 收入</span><span>🔴 支出</span>

    <div class="card-body"><h3>渐变面积图</h3><p>柔和渐变填充 + 平滑曲线，优雅克制，适合杂志风格</p></div>
  </div>

  <div class="card" data-choice="trend-b" onclick="toggleSelect(this)">

      <div style="display:flex;gap:12px;font-size:9px;color:#9c8b7e;margin-top:4px;">
        <span>🟢 收入</span><span>🔴 支出</span><span style="color:#f59e0b;">--- 净额趋势</span>

    <div class="card-body"><h3>混合图表</h3><p>柱状图（收/支）+ 虚线折线（净额趋势），信息量大，适合分析型用户</p></div>
